app = "rag-faq-backend"     
primary_region = "nrt"       

[build]
  # リポジトリルートの Dockerfile を使用する想定
  # 別パスにある場合は下記を有効にしてパスを指定
  # dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000       
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

